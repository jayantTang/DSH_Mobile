# CI — 只跑「干净机器上也能跑」的那一半
#
# 边界是刻意的：这里覆盖协议层、连接器、插件与中转的单测，以及**不带本机配置文件**
# 的 App 构建（也就是别人 clone 下来的样子）。它要回答的问题是「这个仓库本身能不能
# 构建、能不能过测试」，而不是「作者的机器上能不能过」。
#
# 不进 CI 的（仍需在真机上按规范验）：
#   * 仿真器逐屏核对 —— 要一台 macOS + 仿真器 + 真实中转，且判定靠看图，不是断言；
#   * 经公网中转的手机端验证 —— 需要 `~/.dsh/mobile-link/agent.json` 里的真实身份；
#   * 发布前归档 —— 需要开发者团队 ID（`DSH_TEAM_ID` / `Signing.local.plist`），
#     那是开发者私有的，不进公共 runner；
#   * 重启 DSH 后的连接验证 —— 依赖本机进程与真实会话。
# 把这几项塞进 CI 只会得到假绿灯：DSHKit 的集成测试在公共 runner 上会整片 skip。
#
# 每个作业都写了 `timeout-minutes`（Linux 20 分钟、macOS 30 分钟；正常分别是 1–2 分钟与
# 2–7 分钟）。2026-10-13 夜里 `dshkit` 在 runner 上卡了 5 小时没有动静，连取消请求都要等
# runner 自己回应——不写上界时默认是 6 小时，白占一张 macOS runner。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：仓库网页 Actions → 这个工作流 → Run workflow，不必等下一次 push。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本机的真值都不入库，这是这个仓库最容易犯的错，所以单独一条先跑。
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 本机专用的文件没有被提交
        run: |
          set -e
          status=0
          for path in .env.local AGENTS.md \
                      ios/DSHMobile/Config.local.xcconfig \
                      ios/DSHMobile/Signing.local.plist; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path 被跟踪了——它装的是本机真值，必须留在 .gitignore 里"
              status=1
            else
              echo "ok  $path 未入库"
            fi
          done
          exit $status
      # 家目录、凭据形状、邀请码形状、真实中转地址统一由下面这一步的脚本判定。
      # 这里曾经有一段内联 grep，它与脚本各持一份白名单：2026-10-24 新增的 Go 夹具
      # （`agt_0123456789abcdef` 等）只登记在脚本里，内联那份当场把绿灯判成红灯。
      # 判定只留一处，重复的那份删掉。
      - name: 真值检查（邀请码形状、真实中转地址、本机凭据）
        # 同一个脚本也能在本机跑（`npm run check:secrets`）：有 .env.local 时连真实值
        # 一起比对，公共 runner 上没有它，就只跑不依赖真值的形状检查。
        # 想在 CI 里也比对真实主机，就在仓库 secrets 里配 DSH_SITE / DSH_RELAY_URL。
        env:
          DSH_SITE: ${{ secrets.DSH_SITE }}
          DSH_RELAY_URL: ${{ secrets.DSH_RELAY_URL }}
        run: node scripts/dev/check-secrets.mjs

  # 仓库卫生 + 契约检查 + 脚本单测。这三样都是"离线、几秒、不需要平台"的检查，
  # 放同一个 job：contracts 是文本级守卫（三端读同一份向量 / 安装目录阶梯 /
  # 调试钩子闸门），它必须进 CI —— 不进 CI 的守卫等于没有。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 文档规范（结构、口吻、链接、本机路径）与真值检查同属"仓库卫生"，
      # 但单独一条：出问题时一眼看出是文档还是凭据。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:docs
      - name: 契约守卫（DLP 向量接线 / 安装目录阶梯 / 调试钩子闸门 / 单一来源）
        run: npm run check:contracts
      - name: 脚本单测（含测试台与契约检查自身的用例）
        run: npm run test:scripts
      # 纯文本解析 + readdirSync，不依赖 macOS / Xcode / 网络（本机 0.3s），
      # 所以放在这个 Ubuntu job 里跑没有平台风险，不必新建 job。
      - name: 本地化检查（双向缺键 / 硬编码 / 未本地化绑定）
        run: npm run check:i18n
      # 会 trap 的写法（整数溢出 / 非法闭区间 / try! / precondition / Double→Int）。
      # 同样是纯文本扫描 + find，不依赖 macOS / Xcode，本机 0.1s。
      - name: trap 写法闸门（崩溃类问题，基线在 scripts/dev/trap-exemptions.json）
        run: npm run check:traps
      # 模块边界（spec 023 R1–R6）：DSHKit 不得依赖 UI 框架、App 侧整包 import 只允许白名单文件。
      # 同样是纯文本扫描；S0–S3 是报告模式（只给证据），S4 起切拦截。
      - name: 模块边界守卫（依赖方向，白名单在 scripts/dev/layer-whitelist.json）
        run: npm run check:layers
      # Modules 的路径级层规则：C1 依赖、C2 禁 UI、C6 声明一致、C7 路径覆盖、
      # C8 Domain 禁实现层类型、C9 生产 target 必须 Swift 6。纯文本扫描。
      - name: Modules 层与接口闸门（check-module-boundaries）
        run: npm run check:module-boundaries
      # DSHKit 导出面预算：优先 symbol graph（2,200 符号）；无 Swift 时退回 1,665/283 粗筛。
      - name: DSHKit 公开面预算（check:public-api）
        run: npm run check:public-api

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - plugins/mobile-link
          - plugins/send-image
          - plugins/doubao-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        # 插件在机器上跑时会读 $DSH_HOME；CI 里没有真的 home，显式指到临时目录，
        # 免得哪条用例哪天开始悄悄依赖公共 runner 的家目录。
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: mkdir -p "$DSH_HOME" && npm test

  relay-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 版本跟 relay-go/go.mod 的 `go` 指令一致。
          go-version: '1.27.x'
          cache: false
      - name: 单元测试（独立临时库，不碰真实数据）
        working-directory: relay-go
        run: go test ./...
      # 黑盒契约套件对纯 Go 二进制跑（与本地 `make test-blackbox` 同一套用例）。
      - name: 构建（纯 Go，静态）
        working-directory: relay-go
        run: CGO_ENABLED=0 go build -trimpath -o bin/dsh-relay ./cmd/dsh-relay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装黑盒套件依赖
        run: pip install -r relay-go/requirements-dev.txt
      - name: 黑盒契约套件
        working-directory: relay-go
        env:
          RELAY_CMD: ${{ github.workspace }}/relay-go/bin/dsh-relay serve
          ADMIN_CMD: ${{ github.workspace }}/relay-go/bin/dsh-relay admin
        run: python -m pytest tests/blackbox -q

  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 切换演练那半（test_split_runtime.py）要一个真的网关与真两个服务：只有真请求
      # 能钉住"Caddy 按更具体路径把 /dsh-link/feedback/* 分流到 mail"这条求值规则。
      - name: 装 caddy（切换演练要一个真的网关）
        run: |
          set -e
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update && sudo apt-get install -y caddy
      # 这一步不能省：装不上时 skipif 会把切换演练变成 skipped，CI 反而"更绿"。
      - name: 确认 caddy 真的装上了（否则会静默退化成 skip）
        run: command -v caddy && caddy version
      - run: pip install -r mail/requirements-dev.txt
      - run: mkdir -p "$DSH_HOME" && python -m pytest -q -rs
        working-directory: mail
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          # 硬性要求 caddy 在场：没有它就收集报错，而不是静默 skip。
          DSH_REQUIRE_CADDY: '1'

  dshkit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: swift test（协议层）
        working-directory: ios/DSHMobile/DSHKit
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        # 四个 Live* 测试依赖本机真实 endpoint.json，CI 里没有；2026-10-31 的 job 在
        # LiveDuplicateAuditTests 处挂起 30 分钟被取消。这里显式跳过，别让“没有数据”
        # 变成“测试进程挂着”。
        run: |
          mkdir -p "$DSH_HOME"
          swift test \
            --skip LiveIntegrationTests \
            --skip LiveDuplicateAuditTests \
            --skip LiveWorkspaceFileVersionTests \
            --skip LiveTurnTests

  app-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 放在 macOS job：check:project 用 plutil 解析 pbxproj，必须与本地同一条判定。
      - name: App 工程与源文件一致（相对路径 / stale 引用）
        run: node scripts/dev/check-project.mjs
      # UI 用例依赖真实宿主与中转，CI 只校验验收子集的完整性与禁止项；
      # 真实执行由发版前在本机跑 `npm run test:acceptance`。
      - name: 验收用例子集完整性
        run: node scripts/dev/check-acceptance.mjs
      - name: Release 构建：clone 下来的样子（没有本机 xcconfig）
        working-directory: ios/DSHMobile
        run: |
          set -o pipefail
          xcodebuild -project DSHMobile.xcodeproj -scheme DSHMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -5
      - name: 构建产物必须回落到占位符地址
        working-directory: ios/DSHMobile
        run: |
          set -e
          plist="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/DSHMobile.app/Info.plist"
          relay=$(plutil -extract DSHRelayURL raw -o - "$plist")
          feed=$(plutil -extract DSHUpdateFeed raw -o - "$plist")
          echo "relayURL   = $relay"
          echo "updateFeed = $feed"
          # 没有 Config.local.xcconfig 时，xcconfig 里的占位符必须原样进包：
          # 一旦这里变成别的值，说明又有真值被写进了被跟踪的文件。
          [ "$relay" = 'https://relay.example.com/dsh-link' ] \
            || { echo "::error::relayURL 不是占位符，检查 Config.xcconfig 与 Info.plist"; exit 1; }
          [ "$feed" = 'https://relay.example.com/ios/version.json' ] \
            || { echo "::error::updateFeed 不是占位符，检查 Config.xcconfig 与 Info.plist"; exit 1; }
      - name: Release 产物里不许有调试启动参数
        working-directory: ios/DSHMobile
        run: |
          set -e
          bin="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/DSHMobile.app/DSHMobile"
          status=0
          # 只有这两个名字能靠字符串搜索验：`-DSHDemoMode` 是 12 字节，
          # Swift 会把它做成立即数直接编进指令流，**改前改后都搜不到**，
          # 「0 命中」对它没有诊断力。它由 `npm run check:contracts` 的源码闸门
          # 与一次 Release 行为对照守着（见 docs/relay-contract.json 与批 2 报告）。
          for hook in -DSHForgetDirect -DSHFailAttachmentLoad; do
            count=$(grep -c --text -- "$hook" "$bin" || true)
            echo "$hook -> $count"
            if [ "$count" != "0" ]; then
              echo "::error::$hook 进了 Release 产物——调试钩子必须在 #if DEBUG 里"
              status=1
            fi
          done
          exit $status

  # 006：选择性拦截。CI 跑得了 L1/L2 的等价部分——就是上面那些作业（它们红了 PR 就红）。
  # 这里只做矩阵与渠道入口的守卫（缺格、重复、理由缺失、npm 脚本漂移 → exit 2）。
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 这次改动必须跑哪几级
        run: |
          set -e
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base='HEAD~1'
          fi
          git diff --name-only "$base" HEAD > changed.txt
          echo "改动文件："; sed 's/^/  /' changed.txt
          node scripts/dev/check-lanes.mjs --changed-from changed.txt --ci
