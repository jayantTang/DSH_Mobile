# 多 Agent 开发管线（程序化编排）

> 本文件是管线的唯一事实来源。编排层（主会话）**只传递信息，不掺杂自己意见，不替 owner 做决定。**
> 所有面向 owner 的汇报**讲人话**（只呈现 owner 关注的点）；需要 owner 决策的（非局部技术细节）用**多选题**询问。

## 三个角色

| 角色 | 模型 | 厂商 | skill |
|---|---|---|---|
| 软件架构师 | `kimi-k3` | moonshot | `team-architect` |
| 软件开发工程师 | `deepseek-v4.1-flash` | deepseek | `develop-engineer` |
| 软件测试工程师 | `glm-5.3` | zhipu | `test-engineer` |

约束：开发工程师与测试工程师模型**不同厂**；三个角色各自独立会话，上下文互不可见。

## 管线阶段（固定顺序，程序化推进）

```
[输入：需求]（owner 或管线触发）
   │
   ▼
① ARCH-DESIGN · 软件架构师（kimi-k3）
   读：需求 + 代码现状
   产出：
     - 代码与架构分析（现状、耦合、坏味道、潜在 bug）
     - 设计与修改方案
     - 修改项划分（逐项编号，每项：改哪个文件、怎么改、不要碰什么、怎么算改好）
     - 修改指导（给开发工程师的操作说明）
     - 测试关注点（给测试工程师的输入）
   │
   ▼
   〔GATE-0：owner 看「人话版影响说明」拍板〕
   只呈现：会看到什么变化 / 动不动到别的东西 / 风险与最坏情况 / 怎么确认成功 / 要不要改既定决策
   owner 批准 → 继续；要改 → 回 ①
   │
   ▼
② DEV-IMPLEMENT · 开发工程师（deepseek-v4.1-flash）
   读：① 的修改方案 + 修改指导 + 代码（不直接接需求）
   做：逐项修改代码 + 自测
   产出：代码改动 + 每项自测结果（真实命令输出）
   发现指导做不到 / 自相矛盾 / 漏了关键情况 → 打回 ①，不得临场发挥
   │
   ▼
③ TEST · 测试工程师（glm-5.3，与开发异厂）
   读：① 的设计、修改方案、测试关注点 + ② 的代码改动
   做：
     - 分析并制定测试计划（测什么、怎么测、判定标准）
     - 执行测试
     - 输出测试报告（真实命令与结果）
   产出：测试报告（通过 / 失败清单 + 证据 / 阻塞项）
   │
   ▼
④ ARCH-REVIEW · 软件架构师（kimi-k3，同一角色复跑）
   读：① 的设计与修改项 + ② 改动 + ③ 测试报告
   做（自身先评审，分两支）：
     - 评审不通过 → 写明是「开发没做到」还是「测试不足」：
         开发问题 → 打回 ②；测试问题 → 打回 ③；设计本身有问题 → 回 ①
     - 评审通过 → 汇总，向 owner 汇报并答疑
   评审必须：
     - 逐条核对修改项是否落实
     - 核对测试报告是否覆盖、证据是否成立
     - 主动质疑「设计有没有考虑不全」
   │
   ▼
[GATE-1：owner 看架构师的「人话版结果汇报」]
   只呈现 owner 关注的：改了什么 / 验证结果 / 有没有遗留与风险 / 需要你定的事
   决策用多选题；owner 批准 → 本轮闭环
```

## 交接规则

1. **角色之间只传文件，不传对话**：产物落 `runs/<run-id>/artifacts/`，下一角色读文件。
2. **角色一次性**：每个阶段是独立会话，跑完即弃；架构师在 ① 与 ④ 是两次独立调用（④ 读 ① 落盘的设计，不靠记忆）。
3. **打回必须留痕**：打回原因、涉及修改项、由谁打回，写进 run 记录。

## 编排层（主会话）的边界

- 只做：按本文件推进阶段、把产物在角色与 owner 之间传递、在门禁处用多选题收集 owner 决策。
- **不做**：不补充技术判断、不改写 agent 结论、不替 owner 选择、不省略 owner 该看到的信息。
- 汇报一律转述**对应角色的原话/原产物**，并标明来自哪个角色与模型。

## 面向 owner 的汇报口径

- 讲人话，不用术语；呈现 owner 关注的点（变化、范围、风险、怎么确认、要不要他定）。
- 技术完备性是三个 agent 的责任，不把技术理解负担甩给 owner。
- 需要 owner 决定的，给 2–4 个选项 + 每项代价，不给开放问答题。

## 运行记录

每次运行一个目录 `runs/<id>/`：
- `run.json`：阶段、各角色模型、产物清单、打回记录、owner 决策
- `artifacts/`：设计、修改指导、自测结果、测试计划、测试报告、评审意见、各阶段汇报
- `TIMELINE.md`：人能看懂的进度（随时可查「到哪了」）
