# 多 Agent 开发管线（程序化编排）

> 本文件是管线的唯一事实来源。编排层（主会话）**只传递信息，不掺杂自己意见，不替 owner 做决定。**
> 所有面向 owner 的汇报**讲人话**（只呈现 owner 关注的点）；需要 owner 决策的（非局部技术细节）用**多选题**询问。

## 三个角色

| 角色 | 模型 | 厂商 | skill |
|---|---|---|---|
| 软件架构师 | `kimi-k3` | moonshot | `team-architect` |
| 软件开发工程师 | `deepseek-v4.1-flash` | deepseek | `develop-engineer` |
| 软件测试工程师 | `glm-5.3` | zhipu | `test-engineer` |

约束：开发工程师与测试工程师模型**不同厂**；三个角色各自独立会话，上下文互不可见。

## 管线阶段（固定顺序，程序化推进）

```
[输入：需求]（owner 或管线触发）
   │
   ▼
① ARCH-DESIGN · 软件架构师（kimi-k3）
   读：需求 + 代码现状
   产出：
     - 代码与架构分析（现状、耦合、坏味道、潜在 bug）
     - 设计与修改方案
     - 修改项划分（逐项编号，每项：改哪个文件、怎么改、不要碰什么、怎么算改好）
     - 修改指导（给开发工程师的操作说明）
     - 测试关注点（给测试工程师的输入）
   │
   ▼
   〔GATE-0：owner 看「人话版影响说明」拍板〕
   只呈现：会看到什么变化 / 动不动到别的东西 / 风险与最坏情况 / 怎么确认成功 / 要不要改既定决策
   owner 批准 → 继续；要改 → 回 ①
   │
   ▼
② DEV-IMPLEMENT · 开发工程师（deepseek-v4.1-flash）
   读：① 的修改方案 + 修改指导 + 代码（不直接接需求）
   做：逐项修改代码 + 自测
   产出：代码改动 + 每项自测结果（真实命令输出）
   发现指导做不到 / 自相矛盾 / 漏了关键情况 → 打回 ①，不得临场发挥
   │
   ▼
③ TEST · 测试工程师（glm-5.3，与开发异厂）
   读：① 的设计、修改方案、测试关注点 + ② 的代码改动
   做：
     - 分析并制定测试计划（测什么、怎么测、判定标准）
     - 执行测试
     - 输出测试报告（真实命令与结果）
   产出：测试报告（通过 / 失败清单 + 证据 / 阻塞项）
   │
   ▼
④ ARCH-REVIEW · 软件架构师（kimi-k3，同一角色复跑）
   读：① 的设计与修改项 + ② 改动 + ③ 测试报告
   做（自身先评审，分两支）：
     - 评审不通过 → 写明是「开发没做到」还是「测试不足」：
         开发问题 → 打回 ②；测试问题 → 打回 ③；设计本身有问题 → 回 ①
     - 评审通过 → 汇总，向 owner 汇报并答疑
   评审必须：
     - 逐条核对修改项是否落实
     - 核对测试报告是否覆盖、证据是否成立
     - 主动质疑「设计有没有考虑不全」
   │
   ▼
[GATE-1：owner 看架构师的「人话版结果汇报」]
   只呈现 owner 关注的：改了什么 / 验证结果 / 有没有遗留与风险 / 需要你定的事
   决策用多选题；owner 批准 → 本轮闭环
```

## 交接规则

1. **角色之间只传文件，不传对话**：产物落 `runs/<run-id>/artifacts/`，下一角色读文件。
2. **角色一次性**：每个阶段是独立会话，跑完即弃；架构师在 ① 与 ④ 是两次独立调用（④ 读 ① 落盘的设计，不靠记忆）。
3. **打回必须留痕**：打回原因、涉及修改项、由谁打回，写进 run 记录。

## 编排层（主会话）的边界

- 只做：按本文件推进阶段、把产物在角色与 owner 之间传递、在门禁处用多选题收集 owner 决策。
- **不做**：不补充技术判断、不改写 agent 结论、不替 owner 选择、不省略 owner 该看到的信息。
- 汇报一律转述**对应角色的原话/原产物**，并标明来自哪个角色与模型。
- **角色会话不得直接向 owner 提问**（2026-09-29 owner 要求，起因见下）：三个角色只负责开发，
  不参与流程控制。所以派单里必须写死这条硬约束——角色不许调用 ask_user_question 或任何会弹问题给
  owner 的工具；需要 owner 拍板的事一律写进产物（报告里单列「需要 owner 决定」一节），由编排层处理。
  角色被卡住到无法继续时按契约写 BLOCKED 并结束本轮，**不许停下来等回答**。
  编排层每次派单后要能回答「这一轮有没有角色直接弹问题给 owner」，答不上就是没管住。
- **角色的疑问不许原样透传给 owner**（2026-09-29 owner 追加要求：「太开发细节透传给我没用，
  应该像之前一样处理策略」）。编排层拿到角色的问题后必须先分类，**在管线内部消化掉开发细节**：
  - 技术方向 / 实现取舍 / 「我没复现出来，请定方向」这类**开发细节** → 不进 owner 视野：
    交**架构师角色**裁定，或打回对应角色继续（这正是「打回流程交给开发补充修改」那条）；
  - 只有**产品行为、范围、风险取舍、要不要改既定决策**这类 owner 真正该定的事，
    才由编排层翻成人话 + 2–4 个互斥选项（推荐项在前 + 代价）去问 owner。
  把角色的原始疑问直接转给 owner，属于编排层失职。
- **派单首句必须唯一**（2026-09-29 owner 反馈「会话记录里像同一条输入发了两遍，另一条挂起等着」）：
  子会话的标题由**首句提示词**自动生成，用同一个派单模板会让多个「信使 / 开发 / 架构师」会话
  **同名**，在 owner 的会话列表里看起来像重复发送。所以每份派单的第一行固定写成
  `<run-id> · <角色> · <轮次/事项> · <起始时间>（唯一）`，再写正文。
  另：**子会话归 subagent 路由所有**，host 的 `session/rename`、`session/prompt(steer)` 都会被
  `session/agent-busy` 拒掉——想干预只能通过 `send_message`（仅直连子会话）或重新派单，
  不要去改它们的会话，也不要指望能中途 steer。
  还有：**中断/失败留下的子会话会一直挂在 owner 列表里**（删磁盘也去不掉列表行，要等 DSH 重启），
  所以少派生、用完即弃，别让僵尸会话堆积。
- **跑测 / 复现轮次要自己收尾**（2026-09-29 发现的漏子）：仿真器用例会 `dsh-probe.mjs create-scratch`
  建一次性会话，App 往里发文件后，那个会话里的普通 agent 会自己接话、甚至弹问题——这些临时会话
  如果没删干净（尤其**编排层中断某一轮时**），就会带着「待你回应」留在 owner 的会话列表里。
  所以：派单里必须要求该轮结束时清掉自己造的临时会话；编排层中断任何一轮后，要立刻扫一遍并补删。
- **不许干等：派单里要写死时间预算**（2026-09-29 owner 要求：「不喜欢僵死等待耗时大几分钟，
  希望时间都是有效开发耗时」）：
  - 构建 / 归档 / 全量测试 / UI 用例一律 `run_in_background: true` + 轮询，不许前台等；
  - 前台命令 `timeoutMs` ≤ 120 秒（本机执行器 `bash-sandbox.maxTimeoutMs` 已压到 120 秒，
    见 `~/.dsh/profiles/web/cordis.patch.yml`，生效需重启一次 DSH）；
  - 自己写的测试必须自带时间上限（swift-testing `.timeLimit`、XCTest expectation timeout），
    让「挂死」变成「失败」；这条对开发与测试两个角色都是硬要求，已写进两个角色 skill。
  - 编排层看到某一轮出现 `[timed out after …]` 就要问一句「这 2 分钟是必要耗时还是挂死」，
    是挂死就把上面的约束再收紧，而不是接受它。

## 面向 owner 的汇报口径

- 讲人话，不用术语；呈现 owner 关注的点（变化、范围、风险、怎么确认、要不要他定）。
- 技术完备性是三个 agent 的责任，不把技术理解负担甩给 owner。
- 需要 owner 决定的，给 2–4 个选项 + 每项代价，不给开放问答题。
- **不许用没对齐过的代号**（2026-09-29 owner 要求）：`D1`、`C-24`、`§4.7` 这类**内部条目号一律不许对 owner 说**。
  角色产物里的编号只用于角色之间传文件。要讲局部细节或非用代号不可时，**先确定 owner 有背景**，
  否则必须多带一句「这是什么、在哪、跟你有什么关系」；固定先说「**什么位置、什么问题**」再谈取舍。
  owner 原话：「没有列出来对齐过语言的不要随便起什么代号，改掉这种臭毛病。」

## 运行记录

每次运行一个目录 `runs/<id>/`：
- `run.json`：阶段、各角色模型、产物清单、打回记录、owner 决策
- `artifacts/`：设计、修改指导、自测结果、测试计划、测试报告、评审意见、各阶段汇报
- `TIMELINE.md`：人能看懂的进度（随时可查「到哪了」）
