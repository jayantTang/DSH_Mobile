# XcodeGen 工程声明：DSHMobile
# 生成：cd ios/DSHMobile && xcodegen
# 本文件是工程的单一事实来源；DSHMobile.xcodeproj 是生成产物。
#
# 说明：
# - 构建参数与现状 xcodeproj 逐项对齐（见 025 spec/T003）。
# - 部署地址等机密密钥仍由 Config.xcconfig + Config.local.xcconfig（gitignore）注入，
#   本文件不含真值。

name: DSHMobile

configs:
  Debug: debug
  Release: release
  # OTA（开发版无线安装）克隆自 Release，只多一层签名差异（见 Config.local.xcconfig 的
  # `[config=OTA]` 段）。**必须在 spec 里声明**：原先它是手工加进 project.pbxproj 的，
  # 2026-10-16 一次 `xcodegen generate` 就把它冲掉了，`deploy-ota.sh` 归档随即报
  # 「Unable to find module dependency: DSHSessionsDomain」——OTA 配置不在时，
  # 包产物会按 Debug 编，与 App 的 OTA 配置对不上。
  OTA: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  DSHKit:
    path: DSHKit
  Modules:
    path: Modules

targets:
  DSHMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DSHMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayanttang.dsh
        PRODUCT_NAME: DSHMobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: DSHMobile-Info.plist
        CODE_SIGN_ENTITLEMENTS: DSHMobile.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "DSH Mobile"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      # 签名**按配置**给：Debug/Release 自动签名，OTA 交给 Config.local.xcconfig 的
      # `[config=OTA]`（Manual + 开发证书 + 推送描述文件）。不能写在 base 里——项目里的
      # buildSettings 优先于 xcconfig，base 写 Automatic 会把 OTA 的 Manual 压掉，归档报
      # 「automatically signed, but provisioning profile … manually specified」。
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
        OTA:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIAGNOSTICS
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
      OTA: Config.xcconfig
    dependencies:
      - package: DSHKit
        product: DSHKit
      - package: DSHKit
        product: RelayKit
      - package: Modules
        product: DSHDesign
      - package: Modules
        product: DSHFoundation
      - package: Modules
        product: DSHCore
      - package: Modules
        product: DSHConnectionAPI
      - package: Modules
        product: DSHConnectionDomain
      - package: Modules
        product: DSHConnectionUI
      - package: Modules
        product: DSHSessionsDomain
      - package: Modules
        product: DSHSessionsUI
      - package: Modules
        product: DSHChatDomain
      - package: Modules
        product: DSHChatUI
      - package: Modules
        product: DSHSettingsDomain
      - package: Modules
        product: DSHSettingsUI
      - package: Modules
        product: DSHFeedbackDomain
      - package: Modules
        product: DSHFeedbackUI
      - package: Modules
        product: DSHPluginUI
      - package: Modules
        product: DSHFilesDomain
      - package: Modules
        product: DSHFilesUI

  DSHMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSHMobileTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DSHMobile

  DSHMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DSHMobileUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DSHMobile

schemes:
  DSHMobile:
    build:
      targets:
        DSHMobile: all
        DSHMobileTests: [test]
        DSHMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSHMobileTests
        - DSHMobileUITests
    archive:
      config: Release
